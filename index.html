<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Hiring Ecogreen | Portal Rekrutmen</title>
  
  <!-- Favicon Tab Browser -->
  <link rel="icon" type="image/png" href="https://www.ecogreenoleo.com/frontend/web/img/favicon.png">
  <link rel="apple-touch-icon" href="https://www.ecogreenoleo.com/frontend/web/img/favicon.png">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body { 
      background: radial-gradient(circle at 50% 30%, #065f46 0%, #044332 50%, #022c22 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Container Layar Splash */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    /* Logo Badge Eco Container */
    .brand-icon-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.4),
                  0 0 25px rgba(52, 211, 153, 0.25);
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
      padding: 18px;
    }

    /* Gambar Logo Ecogreen */
    .brand-icon-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.2));
    }

    /* Teks Judul & Subtitle */
    .splash-title {
      color: #ffffff;
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      line-height: 1.2;
    }

    .splash-title span {
      color: #34d399;
    }

    .splash-sub {
      color: #a7f3d0;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 0.35rem;
      opacity: 0.9;
    }

    /* Progress Loader Modern */
    .loader-container {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(52, 211, 153, 0.18);
      border-top-color: #34d399;
      border-right-color: #10b981;
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }

    .loading-status {
      font-size: 0.8rem;
      color: #6ee7b7;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Animasi */
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    @keyframes float { 
      0%, 100% { transform: translateY(0px); } 
      50% { transform: translateY(-6px); } 
    }

    /* Tampilan Iframe */
    iframe {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Layar Splash Screen -->
  <div class="splash" id="splash">
    <!-- Logo Resmi Ecogreen -->
    <div class="brand-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <!-- Kepala & Badan Kandidat -->
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <!-- Kaca Pembesar / Talent Search -->
        <circle cx="17" cy="11" r="3"></circle>
        <line x1="21" y1="15" x2="19.2" y2="13.2"></line>
      </svg>
    </div>

    <!-- Teks Branding -->
    <h1 class="splash-title">E-HIRING <span>ECOGREEN</span></h1>
    <p class="splash-sub">Recruitment Portal</p>

    <!-- Loading Indicator -->
    <div class="loader-container">
      <div class="spinner"></div>
      <span class="loading-status">Memuat Portal...</span>
    </div>
  </div>

  <!-- Google Apps Script Iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxvngKM78xQC-LGDkWLU8HpUB9pHUWhmb9T39Pl6zwoiZLpSEZ6irT8514IEHYYzX4M/exec"
    allowfullscreen
    onload="frameLoaded()">
  </iframe>

  <script>
    function frameLoaded() {
      const splash = document.getElementById("splash");
      const appFrame = document.getElementById("appFrame");
      
      // Animasi Fade Out Halus
      splash.style.opacity = "0";
      setTimeout(() => {
        splash.style.display = "none";
        appFrame.style.display = "block";
      }, 600);
    }
  </script>

</body>
</html>
